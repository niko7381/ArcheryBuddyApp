<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Physical-Training</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-button class="RegButton" size="large" expand="full" [routerLink]="['/physical-training-create']">Register new training</ion-button>
  <ngx-datatable
    class="bootstrap"
    [rows]="allTrainings"
    [rowHeight]="'auto'"
    [headerHeight]="50"
    [columnMode]="'force'" 
    [loadingIndicator]="loadingIndicator"
    [swapColumns]="swapColumns"
    [columns]="columns"
  >

    <ngx-datatable-column name="Date"></ngx-datatable-column>
    <ngx-datatable-column name="Category"></ngx-datatable-column>
    <ngx-datatable-column name="Actions" [sortable]="false">
      <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
        <span>
          <ion-button (click)="details(row.propertyId)" class="tablebuttons" size="small" color="primary">
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>
          <ion-button (click)="delete(row.propertyId)" class="tablebuttons" size="small" color="danger">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </span>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</ion-content>

<!-- routerLink="physical-training-details/{{row.propertyId}}" -->
