<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="auth/login"></ion-back-button>
    </ion-buttons>
    <ion-title class="title">Sign up</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card class="signup-card">
    <ion-card-content class="signup-content">
       <form [formGroup]="credentials" (ngSubmit)="register()">
        
        <div class="input-container">
          <ion-item fill="solid" class="input-item">
            <ion-label position="floating">Email</ion-label>
            <ion-input type="email" placeholder="Email" formControlName="email"></ion-input>
          </ion-item>
        </div>
        
        <div class="input-container">
          <ion-item fill="solid" class="input-item">
            <ion-label position="floating">Username</ion-label>
            <ion-input type="displayName" placeholder="Username" formControlName="displayName"></ion-input>
          </ion-item>
        </div>

        <div class="input-container">
          <ion-item fill="solid" class="input-item">
            <ion-label position="floating">Password</ion-label>
            <ion-input type="password" placeholder="Password" formControlName="password"></ion-input>
          </ion-item>
        </div>

        <span class="divider line one-line">Signup</span>

        <ion-button class="signupBtn" expand="block" shape="round" fill="outline" size="large" [disabled]="!credentials.valid" type="submit">Create new user</ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
