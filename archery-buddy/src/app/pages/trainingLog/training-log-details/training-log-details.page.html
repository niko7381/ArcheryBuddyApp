<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="training-log-frontpage"></ion-back-button>
    </ion-buttons>
    <ion-title>Training-Log details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item id="open-modal">
    <ion-icon icon="calendar-outline" slot="start" color="primary"></ion-icon>
    <ion-label>Pick date</ion-label>
    <ion-text slot="end">{{ date }}</ion-text>
  </ion-item>

  <ion-modal trigger="open-modal">
    <ng-template>
      <ion-content>
        <ion-datetime
        #datetime
        presentation="date"
        [value]="dateValue"
        size="cover"
        (ionChange)="dateChanged(datetime.value)"
        showDefaultTimeLabel="false"
        (ionCancel)="showPicker = false;">
          <ion-buttons slot="buttons">
            <ion-button (click)="close()">Dismiss</ion-button>
            <ion-button (click)="select()" color="primary">Select</ion-button>
          </ion-buttons>
        </ion-datetime>
      </ion-content>
    </ng-template>
  </ion-modal>

  <ion-item>
    <ion-input placeholder=" 120" type="number" [(ngModel)]="arrowsShot">Arrows shot:</ion-input>
  </ion-item>


  <ion-item>
    <ion-label position="floating">Weather conditions</ion-label>
    <ion-textarea placeholder="The sun was shining" [(ngModel)]="weather"></ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Focus points</ion-label>
    <ion-textarea placeholder="expansion and shot execution" [(ngModel)]="focusPoints"></ion-textarea>
  </ion-item>
  
  <ion-item>
    <ion-label position="floating">Technical Changes that your working on</ion-label>
    <ion-textarea placeholder="expansion and shot execution" [(ngModel)]="changes"></ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label position="floating">How did the training go</ion-label>
    <ion-textarea placeholder="expansion and shot execution" [(ngModel)]="howDidItGo"></ion-textarea>
  </ion-item>

  <ion-button size="large" expand="block" class="btn" (click)="updateTraining()">Update</ion-button>
</ion-content>
